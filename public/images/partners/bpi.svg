<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="28" fill="#b10022"/>
  <g transform="translate(18, 52)">
    <!-- Crown -->
    <path d="M 22,26 C 22,22 25,18 30,18 C 35,18 38,22 38,26 C 41,20 46,16 52,16 C 58,16 63,20 66,26 C 66,22 69,18 74,18 C 79,18 82,22 82,26 C 85,28 86,32 86,38 C 86,40 68,43 52,43 C 36,43 18,40 18,38 C 18,32 19,28 22,26 Z" fill="#f5ba22"/>
    <ellipse cx="52" cy="14" rx="4" ry="4" fill="#f5ba22"/>
    <ellipse cx="30" cy="16" rx="3" ry="3" fill="#f5ba22"/>
    <ellipse cx="74" cy="16" rx="3" ry="3" fill="#f5ba22"/>
    <!-- Crown base rim -->
    <rect x="24" y="40" width="56" height="5" rx="2" fill="#d49a15"/>

    <!-- Shield Outline & Body -->
    <!-- Left Half: Red with Gold Tower -->
    <path d="M 52,47 L 22,50 L 16,92 C 16,118 42,136 52,142 L 52,47 Z" fill="#9e001c" stroke="#f5ba22" stroke-width="4"/>
    <!-- Right Half: Gold with Red Lion -->
    <path d="M 52,47 L 82,50 L 88,92 C 88,118 62,136 52,142 L 52,47 Z" fill="#f5ba22" stroke="#f5ba22" stroke-width="4"/>

    <!-- Left side Tower (Gold) -->
    <g transform="translate(26, 68)" fill="#f5ba22">
      <!-- Battlements -->
      <rect x="3" y="0" width="4" height="6"/>
      <rect x="9" y="0" width="4" height="6"/>
      <rect x="15" y="0" width="4" height="6"/>
      <!-- Main Tower Body -->
      <path d="M 2,5 L 20,5 L 18,32 L 4,32 Z"/>
      <!-- Doorway -->
      <path d="M 8,24 A 3,3 0 0,1 14,24 L 14,32 L 8,32 Z" fill="#9e001c"/>
      <!-- Windows -->
      <rect x="9.5" y="11" width="3" height="4" rx="1" fill="#9e001c"/>
    </g>

    <!-- Right side Heraldic Lion (Red) -->
    <g transform="translate(56, 66)" fill="#9e001c">
      <!-- Body & Head -->
      <circle cx="15" cy="5" r="4.5"/>
      <path d="M 12,9 C 14,8 18,10 17,16 C 16,21 17,26 14,28 C 11,30 9,27 10,24 C 9,27 7,30 5,31 L 8,32 C 11,32 14,30 16,26 L 19,26 L 22,23 L 20,20 L 18,22 C 19,17 18,12 15,9 Z"/>
      <!-- Paws -->
      <path d="M 16,11 L 22,8 L 24,10 L 18,14 Z"/>
      <path d="M 16,15 L 21,17 L 20,19 L 15,17 Z"/>
      <!-- Tail -->
      <path d="M 10,25 C 6,24 4,18 7,13 C 8,11 6,10 5,12 C 3,16 3,23 8,28 Z"/>
    </g>
  </g>

  <!-- BPI Text -->
  <text x="115" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">BPI</text>
</svg>
